<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZIP-Datei Download</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="icon">📦</div>
    <h2>Datei herunterladen</h2>
    <p>Klicke unten, um das Archiv herunterzuladen.</p>

    <div class="file-info">
      <div><strong>Name:</strong>für-bened.zip</div>
      <div><strong>Typ:</strong> ZIP-Archiv</div>
    </div>

    <!-- Direkter Link zur Datei (funktioniert auch ohne JS) -->
    <a href="für-bened.zip" download="für-bened.zip" id="downloadBtn" class="button">
      ZIP-Datei herunterladen
    </a>
  </div>

  <script src="app.js"></script>
</body>
</html>
